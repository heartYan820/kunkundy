name: Build Android APK

on:
  # 开启下面注释，则push代码就会构建apk
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: 26.1.10909125
  ANDROID_BUILD_TOOLS_VERSION: 34.0.0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            build-tools;34.0.0
            platform-tools
            platforms;android-34
            ndk;26.1.10909125

      - name: Configure NDK
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Build arm64 APK
        run: pnpm tauri android build --config src-tauri/tauri.android.conf.json --apk --target aarch64

      - name: Sign and verify APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          KEY_ALIAS="${KEY_ALIAS_SECRET:-pc-vue-demo}"
          KEYSTORE="$RUNNER_TEMP/release.keystore"

          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEY_PASSWORD_SECRET" ] || [ -z "$STORE_PASSWORD_SECRET" ]; then
              echo "固定签名需要同时配置 ANDROID_KEY_PASSWORD 和 ANDROID_STORE_PASSWORD。" >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
            STORE_PASSWORD="$STORE_PASSWORD_SECRET"
            echo "使用 GitHub Secrets 中的固定签名密钥。"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=PC Vue Demo, OU=Android, O=PC Vue Demo, L=Beijing, ST=Beijing, C=CN"
            echo "未配置固定签名 Secrets，本次使用临时密钥；此 APK 可安装，但后续版本无法用不同密钥覆盖升级。"
          fi

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Tauri did not produce an APK." >&2
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$APK.aligned"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK.signed" "$APK.aligned"
          mv "$APK.signed" "$APK"
          rm "$APK.aligned"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-vue-demo-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
