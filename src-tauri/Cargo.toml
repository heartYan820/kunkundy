[package]
name = "pc-vue-demo"
version = "0.1.0"
description = "Vue demo application packaged with Tauri"
edition = "2021"

[lib]
name = "pc_vue_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
